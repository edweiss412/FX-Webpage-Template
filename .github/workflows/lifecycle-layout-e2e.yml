name: Lifecycle layout e2e (mobile-safari)
# Un-darkens tests/e2e/admin-lifecycle-layout.spec.ts (spec
# 2026-07-24-archive-row-menu-idiom §6 item 6). Deliberately NO
# pull_request.paths filter: four spec-review rounds proved any enumerated
# filter re-opens the dark-path hole (the spec's dependency graph is
# effectively the whole app + harness). workflow_dispatch for close-out
# verification. Advisory-context posture per the owner's quality-only branch
# protection (plans DEFERRED.md 2026-06-22 entry); the ship pipeline's
# all-checks-green gate is the procedural enforcement.
#
# Shape mirrors crew-e2e.yml (native runner; behavior + rect assertions, not
# pixel bytes, so no amd64 Docker raster pin). BASELINE_SERVER_ONLY boots ONLY
# the :3000 webServer (playwright.config.ts filter; the CREW_E2E_ONLY alias).
#
# DARK ON `main`, DELIBERATELY (BL-TAP-TARGET-LAYOUT-SUBPIXEL-TOLERANCE, closed
# 2026-08-25; spec docs/superpowers/specs/2026-08-25-e2e-proof-retired-route-subpixel-design.md
# section 5). That row said this job "is path-filtered". It is not, and the
# correct mechanism matters: there is no `push:` trigger at all below, so the
# job never runs on `main` under any circumstance. Only quality.yml,
# unit-suite.yml and x-audits.yml carry `push: branches: [main]`.
#
# No `push:` trigger is added, and the reasoning is the unfiltered trigger
# itself. Every change reaching `main` ran this spec on its own PR head, so the
# row's stated fear — a tightened assertion sitting latent and first surfacing
# on whichever unrelated PR next touches a matching path — presumes a filter
# that does not exist. What the row actually observed was an ATTRIBUTION
# problem: an arc with no rendering code in its diff ate a red produced by a
# flake. That flake is fixed at its source (the entrance-animation barrier in
# tests/e2e/helpers/devCaptureStaged.ts).
#
# The residual gap is real and narrow: `main` after a merge is not byte-
# identical to the PR head that was measured, so an interaction between two
# independently-green PRs goes unobserved until the next PR. Closing it costs
# FOUR COLD BUILDS on every merge to `main`, not one: the job runs four separate
# Playwright processes, each selecting a webServer with `reuseExistingServer:
# false` whose command runs `pnpm build`, so each step pays its own. That is on
# an advisory job in no required context set, producing a signal with no owner.
# Zero post-merge-only reds have been observed here.
#
# RE-FILE TRIGGER: if a red on this job is ever traced to an interaction present
# on `main` but absent from both contributing PR heads, add
# `push: branches: [main]` and name that run here.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      transitions_repeats:
        description: >-
          Measurement loop: repeat the transitions round-trip case this many
          times (--repeat-each, retries=0, trace=on). "1" = normal full run.
        required: false
        default: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lifecycle-layout-e2e:
    runs-on: ubuntu-latest
    # 35 (was 25): headroom for the workflow_dispatch measurement loop
    # (transitions_repeats × ~60s round-trip samples on top of the PR duty).
    timeout-minutes: 35
    env:
      # Same env contract as crew-e2e.yml: the app (lib/supabase/server.ts /
      # browser.ts default to "" and THROW if unset) + the test runner
      # (signInAs → supabaseAdmin, _b2Helpers → TEST_DATABASE_URL via local
      # bootstrap) + db:seed all need the local Supabase env; the :3000
      # webServer command sets only JWT/ADMIN_DEV/ENABLE_TEST_AUTH/
      # TEST_AUTH_SECRET inline, so the Supabase + build env must be on the
      # runner here. Demo local keys mirror playwright.config.ts's webServer
      # env blocks.
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      SUPABASE_URL: "http://127.0.0.1:54321"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
      SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
      SUPABASE_SECRET_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"
      SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"
      JWT_SIGNING_SECRET: "redeem-link-test-secret-32-bytes-min"
      # Subscriber-token mint (local supabase demo secret — the CI stack's
      # realtime container verifies against the same demo JWT secret; without
      # these the mint 500s and the bridge opens no socket). Needed since the
      # restored compound case in admin-lifecycle-transitions.spec.ts drives
      # tab B's refresh through the realtime bridge (race-cluster spec §6.4;
      # measured on PR #639 run 1: tab-B terminal wait timed out CI-only while
      # local runs read the same secrets from .env.local). Mirrors
      # published-modal-e2e.yml; pinned by
      # tests/cross-cutting/lifecycle-layout-e2e-realtime-wiring.test.ts.
      SUPABASE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      SUPABASE_REALTIME_ISS: supabase-demo
      # Same demo key as crew-e2e.yml. Its ABSENCE here was invisible for
      # months and cost the round-trip case every CI run that survived the
      # commit wedge: the transitions spec's crew re-visit reaches the picker
      # chain (fresh context, no admin session), pickerCookieSigningKey()
      # threw, and resolvePickerSelection failed closed
      # (PICKER_RESOLVER_LOOKUP_FAILED) on 40/40 attempts in run 30236837082.
      # Admin-context crew-URL visits stop at kind:"admin" before the picker
      # chain, which is why the OTHER keyless e2e workflows are unexposed.
      PICKER_COOKIE_SIGNING_KEY: "7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f"
      HASH_FOR_LOG_PEPPER: "fxav-r41-test-pepper-32-chars-min-deterministic"
      GOOGLE_SERVICE_ACCOUNT_JSON: '{"client_email":"walker-fixture@seed-mode.iam.gserviceaccount.com"}'
      ENABLE_TEST_AUTH: "true"
      # MUST match the :3000 webServer's inline TEST_AUTH_SECRET — signInAs
      # sends this as Authorization: Bearer and the server compares its own.
      TEST_AUTH_SECRET: "fxav-m3-test-auth-2026-DO-NOT-SHIP"
      # Boot ONLY the :3000 baseline server (playwright.config.ts filter).
      BASELINE_SERVER_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: supabase/setup-cli@v1
        with:
          # Pinned (NOT `latest`): `latest` resolves via the GitHub API, which
          # rate-limits on shared runners (crew-e2e on PR #102). 2.107.0 is the
          # version supabase-local-bootstrap.sh is known CI-passing with.
          version: 2.107.0
      - name: Install psql (signInAs admin client + bootstrap shell out to psql)
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Boot local Supabase (guarded migrations)
        # Shared bootstrap — same Supabase + GUC + guarded-migration setup the
        # crew/screenshots/help/dev-gate workflows use.
        run: bash scripts/ci/supabase-local-bootstrap.sh
      - name: Seed fixture shows (dashboard + app_settings the admin surface needs)
        run: pnpm db:seed
      # The mobile-safari project spreads devices["iPhone 14"] → webkit (NOT
      # chromium). Mirror crew-e2e.yml and install BOTH so a chromium-defaulting
      # spec can't fail either.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: pnpm exec playwright install-deps chromium webkit
      - run: pnpm exec playwright install chromium webkit
      - name: Run admin lifecycle layout e2e (mobile-safari, :3000 only)
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/lifecycle-layout-e2e-report.json
        run: pnpm exec playwright test --reporter=list,json --project=mobile-safari tests/e2e/admin-lifecycle-layout.spec.ts
      # Informational, never a gate (spec §4.3). `if: always()` is load-bearing: without it
      # this is an ordinary prerequisite-gated step, so a run that RECOVERS and then fails a
      # downstream assertion skips the print entirely — the recovery happened, the list
      # reporter prints no annotations, and a failed run's artifact is not where an operator
      # looks first. The printer always exits 0, so `always()` cannot convert a red run green;
      # the Playwright step's own status remains this job's verdict.
      - name: Print infra-recovery annotations (lifecycle layout)
        if: always()
        run: node scripts/print-infra-recoveries.mjs --report test-results/lifecycle-layout-e2e-report.json
      # admin-lifecycle-transitions (BL-E2E-LIFECYCLE-TRANSITIONS-ROUNDTRIP-FLAKE):
      # the round-trip flake was traced to a CLIENT-side wedge, not CI slowness —
      # the unpublish action POST returned 200 {ok:true} in 237ms with the
      # published:false tree in-body, yet the toggle sat aria-busy="true" for the
      # full 30s while the page kept answering assertion polls (run 30233337644
      # retry1 trace). The transitions step below carries the normal PR run; the
      # workflow_dispatch `transitions_repeats` input turns it into the
      # measurement loop (repeat-each, retries=0, trace=on) that spec §6.1's
      # five-consecutive-greens acceptance is measured with.
      - name: Run admin lifecycle transitions e2e (mobile-safari, :3000 only)
        env:
          # workflow_dispatch input only (write-access callers); still validated
          # numeric below before interpolation.
          REPEATS: ${{ github.event.inputs.transitions_repeats || '1' }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/lifecycle-transitions-e2e-report.json
        run: |
          case "$REPEATS" in
            ''|*[!0-9]*) echo "transitions_repeats must be numeric, got: $REPEATS" >&2; exit 2 ;;
          esac
          if [ "$REPEATS" = "1" ]; then
            pnpm exec playwright test --reporter=list,json --project=mobile-safari tests/e2e/admin-lifecycle-transitions.spec.ts
          else
            pnpm exec playwright test --reporter=list,json --project=mobile-safari tests/e2e/admin-lifecycle-transitions.spec.ts \
              -g "Published toggle round-trip" --repeat-each="$REPEATS" --retries=0 --trace=on
          fi
      # Informational, never a gate (spec §4.3). `if: always()` is load-bearing: without it
      # this is an ordinary prerequisite-gated step, so a run that RECOVERS and then fails a
      # downstream assertion skips the print entirely — the recovery happened, the list
      # reporter prints no annotations, and a failed run's artifact is not where an operator
      # looks first. The printer always exits 0, so `always()` cannot convert a red run green;
      # the Playwright step's own status remains this job's verdict.
      - name: Print infra-recovery annotations (lifecycle transitions)
        if: always()
        run: node scripts/print-infra-recoveries.mjs --report test-results/lifecycle-transitions-e2e-report.json
      # AC-11 of the cn-migration arc: the two sizing canonicalizations (C1 max-w-[60px]
      # -> max-w-confirm-box, C5 min-h-(--spacing-right-now-min-h) -> min-h-right-now-min-h)
      # must not move geometry, verified against a baseline captured BEFORE the fix landed.
      # This workflow is the right host: mobile-safari (both targets' precedents live
      # there; admin-layout-e2e.yml is desktop-chromium), and it fires on UNFILTERED
      # pull_request:, so a spec named here is PR-COVERED and needs no LOCAL_ONLY_ALLOWLIST
      # row — adding one would fail tests/ci/_metaE2eWorkflowCoverage.test.ts's shadowing
      # assertion. Deliberately sets NO CAPTURE_CANONICAL_DIMENSIONS: capture mode fails by
      # design, so CI can never regenerate the oracle it verifies against.
      - name: Run canonical-class dimension e2e (mobile-safari, :3000 only)
        run: pnpm exec playwright test --project=mobile-safari tests/e2e/canonical-class-dimensions.spec.ts
      # Tap-target inline controls (spec 2026-08-10-tap-target-inline-controls §6): the five
      # repaired chrome controls measured on their PRODUCTION routes. mobile-safari is where the
      # floors matter most — sites 6/7 are the tel:/mailto: links an operator taps off a load-out
      # card on a phone. This workflow is the right host for the same reason the canonical-class
      # step lives here: its existing business is admin-route layout/dimension assertions, and it
      # fires on UNFILTERED pull_request:, so a spec named here is PR-COVERED and needs no
      # LOCAL_ONLY_ALLOWLIST row.
      #
      # This step carries its OWN execution oracle, which the job had none of before (spec R4 F1).
      # --retries=0 is load-bearing, not decoration: playwright.config.ts sets
      # `retries: process.env.CI ? 2 : 0`, so without the flag a fail-then-pass retry reads as a
      # green run and the oracle's first-attempt bar is defeated silently.
      - name: Run tap-target inline-controls layout e2e (mobile-safari, :3000 only)
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/lifecycle-layout-tap-target-report.json
          # The wizard step-3 surfaces this spec measures reach
          # lib/onboarding/sessionLifecycle.ts's postgres.js path, which resolves
          # `TEST_DATABASE_URL ?? DATABASE_URL` and THROWS when neither is set and
          # NODE_ENV is production — which is exactly this job (`pnpm build &&
          # pnpm start`). The three older steps here never touch that path, so the
          # job had no reason to carry a DSN until now. Measured on the first real
          # CI run of this step: "onboarding session lifecycle requires
          # DATABASE_URL in production", eight times, every wizard render.
          # DATABASE_URL, not TEST_DATABASE_URL: the latter is this repo's name for
          # the REMOTE validation project (x-audits.yml passes a secret into it),
          # and pointing it at the local stack here would read as that.
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm exec playwright test tests/e2e/tap-target-inline-controls.layout.spec.ts --project=mobile-safari --retries=0 --reporter=list,json
      # Control-outline cover widening (spec 2026-08-26 §14 and AC-13): the dimension
      # pairs, and the CONTRAST claim the whole arc exists to move. Same host and same
      # reasoning as the two steps above: mobile-safari is the 390px project, and this
      # workflow fires on UNFILTERED pull_request:, so a spec named here is PR-COVERED
      # and needs no LOCAL_ONLY_ALLOWLIST row (adding one would fail
      # tests/ci/_metaE2eWorkflowCoverage.test.ts's shadowing assertion).
      #
      # DATABASE_URL for the same reason the tap-target step above carries it, and it is
      # load-bearing for exactly one of the twelve cases: the wizard step-indicator pill
      # is measured on its REAL route at /admin?step=2 (its module is a server component,
      # so the bundle harness the other four use cannot mount it), and getting there runs
      # `enterWizardAdminState` through lib/onboarding/sessionLifecycle.ts's postgres.js
      # path, which throws without a DSN under `pnpm build && pnpm start`.
      #
      # --retries=0 for the same reason as above: playwright.config.ts sets
      # `retries: process.env.CI ? 2 : 0`, so without the flag a fail-then-pass retry
      # reads as a green run.
      - name: Run control-outline dimension + contrast e2e (mobile-safari, :3000 only)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm exec playwright test tests/e2e/control-outline-dimensions.layout.spec.ts tests/e2e/control-outline-contrast.live.spec.ts --project=mobile-safari --retries=0
      # No `if:` — this must run on the success path, which is the only path where a
      # vacuously-green run is dangerous. A runtime `test.skip()` skips every case while --list
      # still reports them, so the run exits 0 having proved nothing; this reads the run's OWN
      # report and enforces a per-spec executed floor measured from a real run.
      - name: Assert the tap-target layout spec actually executed
        run: node scripts/check-lifecycle-layout-executed.mjs
      - name: Upload Playwright traces/report (diagnosis artifact)
        # Dispatch runs are measurement runs — keep traces from GREEN samples
        # too (a wedge that self-recovers inside the budget is still evidence).
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-layout-e2e-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            playwright-report/
            test-results/
          retention-days: 7
