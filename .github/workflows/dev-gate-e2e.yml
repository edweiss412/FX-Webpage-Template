name: Dev-gate e2e (build-vs-runtime)
# B1-D4 (DEFERRED.md, M12.2 admin-redesign plan tree). Runs the three dev-gate
# Playwright projects against tests/e2e/admin-dev.spec.ts to verify the
# build-vs-runtime contract for the /admin/dev panel end-to-end:
#
#   dev-build (:3001)        — built ADMIN_DEV_PANEL_ENABLED=true  → /admin/dev 200, settings link visible
#   prod-build (:3002)       — built UNSET                         → /admin/dev 404, no settings link
#   prod-runtime-flip (:3003) — built UNSET, started runtime=true   → /admin/dev STILL 404, no link
#                              (artifact-time gate wins over runtime env — the M3 build-vs-runtime class)
# CARVE-OUT: the "/admin/dev 404 in prod" claims above cover the dev PANEL +
# source-link-dim + telemetry-dim only; /admin/dev/telemetry is the deliberate
# PROD-available exception (developer-gated at runtime, not build-gated).
#
# The three projects are chained via Playwright `dependencies` (prod-runtime-flip
# → prod-build → dev-build), so they run sequentially. DEV_GATE_ONLY=1 boots ONLY
# the :3001/:3002/:3003 webServers (playwright.config.ts filter); without it,
# the :3000 + :3004 servers ALSO run `pnpm build` and all five cold builds
# contend on the shared with-admin-dev-flag lock (the B1-D4 timeout class).
#
# These specs assert HTTP status codes (200/404), NOT pixel bytes, so the
# amd64 Docker raster pin used by screenshots-drift.yml is NOT needed here —
# this mirrors help-affordances.yml's native-runner + `playwright install`
# shape instead. `workflow_dispatch` so the orchestrator can fire it during
# close-out (real-CI-green is its own gate — local-passes-CI-fails class).
on:
  # Dispatch + daily schedule + PATH-FILTERED pull_request. The three serialized
  # cold builds make this gate heavy (~11 min job measured 2026-08-09), so it is
  # NOT unconditionally per-PR: only PRs that touch the surfaces the three
  # dev-gate projects actually test pay for it. Everything else stays on the
  # 24h schedule backstop. Dispatch remains for orchestrator close-out
  # (real-CI-green is its own gate — the local-passes-CI-fails class). B1-D4.
  workflow_dispatch:
  # DAILY schedule, added 2026-07-26 (PR4 of the CI-dark cluster). Dispatch-only
  # meant this gate fired when someone remembered, and
  # tests/e2e/attention-modal-gallery.spec.ts rotted behind it. Twenty-four
  # hours bounds how long a break can hide — and remains the ONLY line of
  # defense for regressions arriving through files OUTSIDE the pull_request
  # filter below (e.g. shared admin components not listed there; the 2026-07
  # rot arrived through components/admin/ churn). That gap is deliberate: the
  # filter prices the job only onto the PRs most likely to break these specs,
  # and the schedule prices everything else at a 24h detection bound.
  schedule:
    - cron: "17 6 * * *"
  # Path-filtered PR trigger (2026-08-09, BL-DEV-GATE-GALLERY-SPEC-ROT
  # close-out). The gallery spec's value IS the built
  # ADMIN_DEV_PANEL_ENABLED=true artifact — the route is build-gated, so it can
  # never move to the :3000 baseline project without dissolving the
  # build-vs-runtime contract this workflow exists to prove. The dedicated
  # projects stay; reachability comes from running here when the tested
  # surfaces change. NOT a required context: a path-filtered job is absent on
  # non-matching PRs, and required-but-skipped contexts wedge merges.
  pull_request:
    paths:
      # The specs the three dev-gate projects run, and their harness.
      - "tests/e2e/admin-dev.spec.ts"
      - "tests/e2e/attention-modal-gallery.spec.ts"
      - "playwright.config.ts"
      - ".github/workflows/dev-gate-e2e.yml"
      # The build-gated dev surface itself.
      - "app/admin/dev/**"
      - "components/admin/dev/**"
      # The scenario catalog + derivers the gallery renders and the spec
      # re-derives its expectations from.
      - "lib/dev/**"
      # The modal under test and its shell/menu (the 2026-07 rot sites).
      - "components/admin/showpage/PublishedReviewModal.tsx"
      - "components/admin/showpage/AttentionMenu.tsx"
      - "components/admin/review/ReviewModalShell.tsx"

# Cancel a superseded run when the PR branch is re-pushed — three serialized
# cold builds hold a heavy runner for ~11 min, so a stale run is expensive.
# Schedule/dispatch runs are never cancelled (the PR-only guard below).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dev-gate-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: supabase/setup-cli@v1
        with:
          # Pinned (NOT `latest`): `latest` resolves via the GitHub API, which rate-limits
          # on shared runners and fails setup. 2.107.0 = the supabase-local-bootstrap.sh
          # known CI-passing version (PR #102; older 2.98.2 broke the in-container psql auth); a fixed version downloads directly (no API lookup).
          version: 2.107.0
      - name: Install psql (signInAs admin client + bootstrap shell out to psql)
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Boot local Supabase (guarded migrations)
        # Shared bootstrap (M12.12 Task 14) — same Supabase + GUC + guarded-
        # migration setup screenshots-drift.yml and help-affordances.yml use, so
        # the hold-aside list cannot drift between workflows.
        run: bash scripts/ci/supabase-local-bootstrap.sh
      # The dev-gate projects all spread devices["Desktop Chrome"] → chromium only.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      # Split from `install --with-deps`: install-deps (apt) always runs, but the
      # browser binaries are restored from the cache above on a hit.
      - run: pnpm exec playwright install-deps chromium
      - run: pnpm exec playwright install chromium
      - name: Run dev-gate projects (three serialized builds)
        env:
          # signInAs (tests/e2e/helpers/signInAs.ts) runs in the TEST-RUNNER
          # process and reads the Supabase service-role client (supabaseAdmin.ts)
          # to delete/create the fixture user, then POSTs the per-run secret as
          # Authorization: Bearer to /api/test-auth/set-session. The webServer.env
          # only reaches the Next server processes, NOT the Playwright workers, so
          # these must be set on the runner here (mirrors help-affordances.yml).
          ENABLE_TEST_AUTH: "true"
          # Must MATCH the three dev-gate webServers' build/start secret
          # (playwright.config.ts: fxav-m3-test-auth-2026-DO-NOT-SHIP), NOT the
          # :3004 server's test-secret-fixture — signInAs sends this as Bearer
          # and the server compares against its own TEST_AUTH_SECRET.
          TEST_AUTH_SECRET: "fxav-m3-test-auth-2026-DO-NOT-SHIP"
          # Defensive: none of this workflow's projects calls
          # pickerCookieSigningKey() today, so no gate and no run here proves this
          # entry. Its webServer serves the whole app, so a future spec reaching the
          # picker chain would throw without it.
          PICKER_COOKIE_SIGNING_KEY: "7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f"
          # Boot ONLY the :3001/:3002/:3003 dev-gate webServers — see the
          # workflow header + playwright.config.ts filter. Without this, all five
          # servers cold-build and contend on the with-admin-dev-flag lock.
          DEV_GATE_ONLY: "1"
          # Build- + server-critical env for the :3001/:3002/:3003 webServers, which
          # carry NO `env:` block in playwright.config.ts and so inherit ONLY this
          # runner env for their `pnpm build` + `next start`. `next build` evaluates
          # app/api/auth/picker-bootstrap/route.ts -> lib/email/hashForLog.ts, which
          # THROWS at module eval unless HASH_FOR_LOG_PEPPER >= 32 chars; the
          # /admin/settings render (requireAdmin) and /api/test-auth/set-session
          # create Supabase server/service-role clients (lib/supabase/server.ts) that
          # throw without the Supabase env. Demo local keys copied verbatim from
          # crew-e2e.yml (the proven-green no-env-block-webServer parallel, :3000).
          HASH_FOR_LOG_PEPPER: "fxav-r41-test-pepper-32-chars-min-deterministic"
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
          SUPABASE_URL: "http://127.0.0.1:54321"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
          SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
          SUPABASE_SECRET_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"
          SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"
          JWT_SIGNING_SECRET: "redeem-link-test-secret-32-bytes-min"
          GOOGLE_SERVICE_ACCOUNT_JSON: '{"client_email":"walker-fixture@seed-mode.iam.gserviceaccount.com"}'
        # prod-runtime-flip depends on prod-build depends on dev-build, so naming
        # all three runs them in that serialized dependency order.
        run: pnpm exec playwright test --project=dev-build --project=prod-build --project=prod-runtime-flip
      # BL-FONT-STYLESHEET-GRAPH-FIDELITY: the built-artifact font oracle.
      #
      # THIS WORKFLOW IS THE HOST because it already produces a production build
      # — the prod-build project writes NEXT_DIST_DIR=.next-prod
      # (playwright.config.ts). Nothing extra is compiled here; the step just
      # reads the CSS that build emitted.
      #
      # The oracle asserts the SHIPPED @font-face universe against emitted CSS
      # rather than against a source walk, which cannot see a face arriving
      # through a dependency-internal stylesheet or a package `exports` subpath.
      # Without FONT_ARTIFACT_DIR the artifact row skips by premise (named, not
      # silent), so unit-suite stays build-free; the escape-fixture rows run
      # everywhere.
      #
      # `if: always()` so a failing e2e project does not hide a font regression —
      # the build artifact exists either way, and these are independent claims.
      - name: Font-face oracle against the built artifact
        if: always()
        env:
          FONT_ARTIFACT_DIR: .next-prod
        run: pnpm vitest run tests/styles/fontBuiltArtifact.test.ts
      - name: Upload Playwright traces/report (diagnosis artifact)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-gate-e2e-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            playwright-report/
            test-results/
          retention-days: 7
