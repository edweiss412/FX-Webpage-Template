name: Crew e2e (mobile-safari + desktop-chromium)
# Runs NINE e2e spec files against a real browser + a seeded local Supabase. Both
# projects are passed to one invocation and each project's testMatch claims its own
# specs, so the per-project split is a RESOLUTION, not a list maintained here —
# verify it with `--list` rather than trusting this comment:
#   mobile-safari     crew-section-toggle, crew-page, theme-toggle, font-rendering-census
#   desktop-chromium  picker-flow, alert-action-links, stage-restricted-crew-schedule,
#                     font-binding, font-rendering-census, theme-toggle
# (font-rendering-census and theme-toggle resolve under BOTH — they carry no project
# gate and assert real behaviour under each.) Highlights: the client-side
# section-toggle suite (tests/e2e/crew-section-toggle.spec.ts), the crew picker flow
# (tests/e2e/picker-flow.spec.ts), alert-action-links.spec.ts, the seeded
# stage-restricted crew schedule suite that carries the per-viewer agenda day fold
# (tests/e2e/stage-restricted-crew-schedule.spec.ts), and the font-binding oracle
# (tests/e2e/font-binding.spec.ts), which measures rendered text width on /admin,
# /auth/sign-in and a seeded crew route to prove the app renders the family
# DESIGN.md 2.1 commits to. It runs HERE, on the job that builds and starts the
# production artifact, because the binding rests on the committed @font-face in
# family under the name it puts in `--font-inter` -- `inter` since the loader
# app/fonts.css resolving through --font-inter, which is exactly why the suite
# reads that token instead of comparing a literal. A dev-server-only run would
# leave that unproved against the build CI actually ships. The stage-restricted suite is on chromium
# for the same reason picker-flow is: WebKit cannot store the Secure `__Host-`
# picker cookie over plain http, so every non-admin viewer in it goes dark there
# (measured on this workflow's first run, 2026-08-02).
#
# BL-RESURRECT-MOBILE-SAFARI-E2E closed the mobile-safari gap on 2026-08-09, and this
# job now ALSO runs crew-page.spec.ts (mobile-safari only — see below) and the
# rewritten theme-toggle.spec.ts. M-wave 2 W-E2E (2026-08-10) wired
# right-now-transitions.spec.ts — NINE spec files: the §5.7 fixture-inertness the
# whole-file valve recorded (BL-RIGHTNOW-SECTION57-FIXTURE-INERT) was the
# getShowForViewer per-show cache, not the anchor source; the rewritten suite
# seeds a PER-TEST show (fresh cache tag) with run_of_show in the same locked
# transaction, runs as a real email-matched crew viewer, and is desktop-chromium
# ONLY (the picker-bootstrap __Host- envelope is dark on WebKit over plain http —
# the spec header records the measurement). The M4 tile specs this
# comment used to name are GONE, not pending: nine were 100% test.describe.skip
# against the retired ?crew= viewer mock AND the slug-only /show/[slug] route, which
# has no page.tsx, so every navigation in them 404'd. Per-file coverage accounting is
# §2.3 of docs/superpowers/specs/ci/2026-08-09-resurrect-mobile-safari-e2e-design.md.
#
# crew-page.spec.ts is wired for mobile-safari ALONE. Every one of its cases used to
# early-return off `testInfo.project.name !== "mobile-safari"`, which made a
# desktop-chromium execution a passing no-op that the executed-count oracle would have
# credited as real coverage. Those 22 gates were removed and the spec dropped from the
# desktop-chromium testMatch in the same commit, so what the oracle counts is what ran.
#
# Why this spec needs CI: it proves the section-toggle win in a real browser —
#   • a section tab tap fires ZERO data requests (no server round-trip; freshness
#     invariant: the controller never fetches/caches section data client-side),
#   • back/forward + deep-link via ?s=,
#   • the mobile bottom tab-bar dimensional invariant (getBoundingClientRect),
#   • a CREW_PERF payload+FCP record (the all-sections-render tradeoff measurement).
#
# Shape mirrors dev-gate-e2e.yml / help-affordances.yml (native runner + chromium;
# these specs assert behavior + rects, NOT pixel bytes, so the amd64 Docker raster
# pin used by screenshots-drift.yml is not needed). CREW_E2E_ONLY=1 boots ONLY the
# :3000 webServer (playwright.config.ts filter) so the :3001-:3004 servers don't
# cold-build. workflow_dispatch so close-out can fire it via `gh workflow run`
# (real-CI-green is its own gate — the local-passes-CI-fails class).
on:
  pull_request:
    # INVERTED, after six review rounds each found another missing entry in an
    # allow-list (leaf files, then whole trees, then build inputs like
    # next.config.ts / tsconfig.json / instrumentation.ts / the pretest
    # generators). An allow-list of "things that can affect this job" cannot be
    # completed by inspection: these specs drive whole rendered routes and the job
    # builds the app, so almost any code or config file can break them.
    #
    # paths-ignore cannot be incomplete in the DANGEROUS direction. Anything not
    # listed here triggers the job, so a new build input, config file or module is
    # covered the day it lands. The list holds documentation only — prose cannot
    # change what the app does — and the pin in
    # tests/cross-cutting/picker-flow-e2e-ci-wiring.test.ts asserts exactly that:
    # the workflow uses paths-ignore, and every entry is a docs pattern.
    paths-ignore:
      # Deliberately TINY. Two rounds of "surely this is inert" were both wrong:
      #   - `**/*.md` also ignored fixtures/shows/raw/*.md, which supabase/seed.ts
      #     reads (seed.ts:15) and crew-section-toggle depends on;
      #   - `docs/**` is a BUILD INPUT — prebuild's manifest reads the master spec
      #     and plan files (scripts/pretest-gen.mjs:20+), so a docs change can alter
      #     generated artifacts or fail the cold build.
      # What is left is prose that no script reads: root-level markdown (README,
      # AGENTS, the ledgers), issue templates, and the licence.
      - "*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  workflow_dispatch:

# Cancel a superseded run when the PR branch is re-pushed — this job boots
# Supabase + seeds + Playwright, so a stale run holds a heavy runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  crew-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The crew app (lib/supabase/server.ts:35 / browser.ts:34 default to "" and
      # THROW if unset) + the test runner (signInAs → supabaseAdmin) + db:seed all
      # need the local Supabase env. The :3000 webServer command sets only
      # JWT/ADMIN_DEV/ENABLE_TEST_AUTH/TEST_AUTH_SECRET inline, so the Supabase +
      # build env must be on the runner here (inherited by db:seed, the Playwright
      # workers, AND the spawned :3000 build/start). Demo local keys mirror the
      # :3004 webServer env block in playwright.config.ts.
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      SUPABASE_URL: "http://127.0.0.1:54321"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
      SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
      SUPABASE_SECRET_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"
      SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"
      JWT_SIGNING_SECRET: "redeem-link-test-secret-32-bytes-min"
      HASH_FOR_LOG_PEPPER: "fxav-r41-test-pepper-32-chars-min-deterministic"
      GOOGLE_SERVICE_ACCOUNT_JSON: '{"client_email":"walker-fixture@seed-mode.iam.gserviceaccount.com"}'
      ENABLE_TEST_AUTH: "true"
      # MUST match the :3000 webServer's inline TEST_AUTH_SECRET — signInAs sends
      # this as Authorization: Bearer and the server compares against its own.
      TEST_AUTH_SECRET: "fxav-m3-test-auth-2026-DO-NOT-SHIP"
      # Test-only picker-cookie signing key. pickerCookieSigningKey() throws when
      # unset or not 64 hex, so seedPickerCookie and the server both need it; read
      # at runtime, so this one job-level entry reaches the Playwright process AND
      # the `pnpm start` server it spawns.
      PICKER_COOKIE_SIGNING_KEY: "7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f"
      # Boot ONLY the :3000 baseline server (playwright.config.ts filter).
      CREW_E2E_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: supabase/setup-cli@v1
        with:
          # Pinned (NOT `latest`): `latest` resolves the newest release via the GitHub
          # API, which rate-limits on shared runners and fails setup before the build
          # (crew-e2e on PR #102). 2.107.0 is the version supabase-local-bootstrap.sh is
          # known CI-passing (PR #102; older 2.98.2 broke the in-container psql auth); a fixed version downloads directly (no API lookup).
          version: 2.107.0
      - name: Install psql (signInAs admin client + bootstrap shell out to psql)
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Boot local Supabase (guarded migrations)
        # Shared bootstrap — same Supabase + GUC + guarded-migration setup the
        # screenshots / help / dev-gate workflows use (hold-aside list can't drift).
        run: bash scripts/ci/supabase-local-bootstrap.sh
      - name: Seed the crew corpus (Waldorf fixture the crew specs resolve)
        # crew-section-toggle.spec resolves the seeded show + share_token by
        # drive_file_id (seed-fixture:2026-04-asset-mgmt-cfo-coo-waldorf).
        run: pnpm db:seed
      # The mobile-safari project spreads devices["iPhone 14"] → defaultBrowserType
      # "webkit" (NOT chromium). Mirror help-affordances.yml (its iPhone 14 help-docs
      # project) and install BOTH so a chromium-defaulting spec can't fail either.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      # Split from `install --with-deps`: install-deps (apt) always runs, but the
      # browser binaries are restored from the cache above on a hit.
      - run: pnpm exec playwright install-deps chromium webkit
      - run: pnpm exec playwright install chromium webkit
      # ONE invocation for ALL the specs above, not one per project. Each Playwright
      # process owns and tears down its own webServer, and in CI that server is a
      # cold `pnpm build && pnpm start` — so multiple steps would pay the heaviest
      # phase repeatedly inside this job's timeout. Passing both projects and the
      # file list lets each project's testMatch claim its own specs. The split is a
      # RESOLUTION — re-derive it with `--list` rather than trusting a hand-kept
      # figure here; measured 2026-08-16 it is 163 tests in 10 files (it was
      # "159 tests in 9 files" on 2026-08-15, "148 tests in 8 files" on
      # 2026-08-09 and "27 tests in 5 files" on 2026-08-03, before this job grew
      # crew-page and theme-toggle; the ninth file is right-now-transitions and
      # the tenth is theme-persistence-note, whose four cases are the whole
      # 2026-08-16 delta — five of the 2026-08-15 growth were the crew-page wifi
      # password-row cases, the rest arrived on other arcs).
      # font-rendering-census and theme-toggle resolve under BOTH projects;
      # crew-page resolves under mobile-safari alone, and
      # theme-persistence-note under desktop-chromium alone.
      #
      # picker-flow is on desktop-chromium deliberately. Measured 2026-07-25: over
      # plain http WebKit refuses to STORE the server's Set-Cookie for the
      # `__Host-`-prefixed Secure picker envelope, so the first-contact bootstrap
      # and every real selection fail to persist there and a correct
      # implementation reads as broken; Chromium's localhost exemption stores it.
      - name: Run the crew e2e spec set (both projects, :3000 only)
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/crew-e2e-report.json
        run: pnpm exec playwright test --project=mobile-safari --project=desktop-chromium tests/e2e/crew-section-toggle.spec.ts tests/e2e/picker-flow.spec.ts tests/e2e/alert-action-links.spec.ts tests/e2e/stage-restricted-crew-schedule.spec.ts tests/e2e/font-binding.spec.ts tests/e2e/font-rendering-census.spec.ts tests/e2e/crew-page.spec.ts tests/e2e/theme-toggle.spec.ts tests/e2e/theme-persistence-note.spec.ts tests/e2e/right-now-transitions.spec.ts --reporter=list,json
      # Collected is not executed. A `beforeEach` calling test.skip() skips every case at RUNTIME
      # while --list still counts them, so the wiring guard, its skip registry and this job's exit
      # code all stay green on a suite that ran nothing (whole-diff review R10). This step reads
      # the run's OWN report and fails if a guarded spec did not really run — the same post-run
      # oracle shape as standalone-e2e.yml's baseline comparator.
      - name: Assert the guarded crew specs actually executed
        run: node scripts/check-crew-e2e-executed.mjs
      - name: Upload Playwright traces/report (diagnosis artifact)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crew-e2e-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            playwright-report/
            test-results/
          retention-days: 7
