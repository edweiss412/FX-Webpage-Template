name: Share-link cue e2e (standalone harness)
# Runs the standalone real-browser share-link cue spec
# (tests/e2e/share-link-flash.spec.ts, standalone-chromium project) in real
# Chromium. The spec is FULLY self-contained: its beforeAll bundles the live
# entry through the plugin builder, compiles the token CSS with the Tailwind
# CLI, and serves it over its OWN node:http server — no app boot, no Supabase.
#
# Why its own job: standalone.config.ts is an explicit allow-list that NO
# general CI workflow invokes, so this spec would silently prove nothing on main
# without a dedicated gate. workflow_dispatch so close-out can fire it via
# `gh workflow run` rather than waiting for a matching PR.
#
# Why this job cannot be replaced by the source scan it accompanies: a regex over
# app/globals.css sees fragments, not the cascade. A later duplicate @keyframes,
# an unconditional `animation: none`, an `animation-play-state: paused`, an
# `!important` on either painted property, or a rule scoped to an ancestor
# selector all leave every fragment intact while the cue renders nothing.
on:
  pull_request:
    # DELIBERATELY BROAD, and the repo has already ratified this trade for the
    # same reason: phantom-gap-e2e.yml:36-44 records that scoping a trigger to
    # the folders whose NAMES match the surface left that job entirely dark —
    # "green because it never ran" — and accepts a multi-minute job on most
    # component PRs because the alternative is a probe that misses the edits most
    # likely to trip it.
    #
    # The measured reason here: the harness hydrates the REAL StatusStrip ->
    # ShareHub tree, whose bundle pulls 155 production inputs. Even the leanest
    # valid ancestry reaches lib/a11y, lib/messages, lib/devcapture,
    # components/admin/* and app/admin/_devCaptureAction.ts. A per-file filter
    # for a graph that size is not achievable — five drafts of one were short
    # every time.
    #
    # Note `app/admin/**` and NOT `app/admin/show/[slug]/**`: in GitHub filter
    # syntax `[]` is a one-character character class, so the bracketed form
    # matches nothing. No workflow in this repo globs a bracket directory.
    paths:
      - "components/**"
      - "lib/**"
      - "app/admin/**"
      - "app/help/_affordanceMatrix.ts"
      - "app/globals.css"
      # harness + config
      - "tests/e2e/share-link-flash.spec.ts"
      - "tests/e2e/_shareLinkFlashLiveEntry.tsx"
      - "tests/e2e/_step3ReviewModalBundle.mjs"
      - "tests/e2e/_nextNavigationStub.ts"
      - "tests/e2e/_nodeCryptoStub.ts"
      - "tests/e2e/standalone.config.ts"
      - ".github/workflows/share-link-flash-e2e.yml"
      # runtime inputs: the harness compiles CSS through the Tailwind CLI and
      # drives Playwright, so a dependency, workspace-policy, TypeScript-config
      # or setup-action change can break it with no source edit at all.
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - ".github/actions/setup/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  share-link-flash-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: pnpm exec playwright install-deps chromium
      - run: pnpm exec playwright install chromium
      - name: Run share-link cue standalone spec (no webServer)
        run: pnpm test:e2e:share-link-flash
      - name: Upload Playwright traces/report (diagnosis artifact)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: share-link-flash-e2e-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            playwright-report/
            test-results/
          retention-days: 7
