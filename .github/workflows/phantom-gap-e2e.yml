name: phantom-gap-e2e

# The zero-extent-flex-item probe on the REAL surfaces it was widened to
# (BL-PHANTOM-GAP-PROBE-OTHER-SURFACES): the /admin dashboard, the hydrated show
# modal at /admin?show=<slug>, and all six sections of the seeded crew page.
# Catches the class where an always-rendered wrapper whose content is
# state-gated collapses to zero extent and still charges its parent's `gap` — a
# seam no visible element accounts for.
#
# The published review modal is ALSO probed by the static harness suite
# (published-review-modal.layout.spec.ts, run by published-modal-e2e.yml). That
# one never hydrates; this one does. Neither subsumes the other.
#
# WHY ITS OWN WORKFLOW. Both host specs — crew-layout-dimensions.spec.ts and
# admin-layout-dimensions.spec.ts — are matched by playwright projects but were
# invoked by NO workflow, so everything in them has been running nowhere in CI
# (the BL-E2E-APP-DEPENDENT-SPECS-CI-DARK shape). Mounting a probe into a dark spec
# would have made the probe dark too: green locally, catching nothing on any PR.
# This job is what makes the mount real. It runs ONLY the probe cases (`-g`), so
# it does not adopt the rest of those files' flake surface; un-darkening the
# remaining cases is still BL-E2E-APP-DEPENDENT-SPECS-CI-DARK's job.
#
# TWO PROJECTS, deliberately, and the reason differs per step. The dashboard
# cases run under desktop-chromium. The CREW PHANTOM-GAP cases run under
# mobile-safari because that describe is single-writer (it seeds run_of_show in
# beforeAll and restores it in afterAll, and every other project early-returns
# from it). The DIAGRAM step runs BOTH projects: its describe has no beforeAll
# writer, so it is not single-writer, and the zoom-gate arc split its coverage on
# capability — the network-order gate needs Chromium's keyboard path, the tier
# assertion needs none. Adding a project to a file whose cases early-return would
# turn those cases into passing no-ops, so the same arc converted every gate in
# that describe to a DECLARED skip, and the step also runs an executed-count
# oracle keyed on (case title, project) so the shape cannot return unnoticed; see
# its own comment below.
on:
  pull_request:
    paths:
      - "tests/e2e/helpers/phantomGap.ts"
      - "tests/e2e/admin-layout-dimensions.spec.ts"
      - "tests/e2e/crew-layout-dimensions.spec.ts"
      # The measured trees. A phantom item is introduced by a component edit, not
      # by a test edit, so the surfaces themselves are the load-bearing triggers.
      #
      # `components/**`, not the admin + crew subtrees alone: the measured roots
      # render shared leaves (atoms, tiles, diagrams, message cards), and one of
      # those collapsing to zero extent is charged to whatever gapped row holds
      # it. Scoping the trigger to the folders whose NAMES match the surface left
      # an `Avatar.tsx`-shaped edit able to introduce an offender in both measured
      # trees with this job entirely dark — the same "green because it never ran"
      # failure this workflow exists to end. The cost is that most component PRs
      # now run a ~6-minute job; the alternative is a probe that misses the edits
      # most likely to trip it.
      - "components/**"
      - "app/admin/**"
      - "app/show/**"
      # The private diagram asset route. The gallery cases added below assert what
      # the BROWSER fetched, so this route's accept-set decides whether every
      # thumbnail resolves or 410s — and `app/**` here is subtree globs, so a
      # route-only change matched none of the other entries and would have left
      # this job dark on exactly the surface those cases measure.
      - "app/api/asset/**"
      - "app/globals.css"
      # The ROOT layout wraps every measured page, so inherited typography or
      # sizing set there can crowd a gapped row until a spacer reaches zero width
      # — the exact shape of the `ModalSectionChrome` instance this branch
      # ledgered. It matches none of the entries above (they are subtree globs and
      # a stylesheet), so a layout-only PR would have skipped this job.
      - "app/layout.tsx"
      - "playwright.config.ts"
      - "tests/e2e/helpers/**"
      # The standalone specs and harnesses that used to be listed here
      # (phantomGapHelper.layout, section-header-layout.layout,
      # pusher-alignment.layout and their four harness files) are gone from this
      # filter along with the legs that ran them. standalone-e2e.yml runs them
      # unfiltered on every PR, so a filter entry here would only re-trigger this
      # job for specs it no longer executes.
      # The shared width constant. Listed because a change to it re-aims BOTH the
      # static matrix and the real-route width-chain assertion, and neither spec
      # file need be touched for that to happen.
      - "tests/e2e/_sectionHeaderWidths.ts"
      - ".github/workflows/phantom-gap-e2e.yml"
      # WHAT THE TREES ARE MADE OF, not just what renders them. Two ledger rows
      # pin exact occurrence COUNTS against the seeded show, so anything that
      # changes what that show contains changes the expected result: reshape the
      # Waldorf fixture so a stage-only travel leg gains a stage, and the blank
      # eyebrow disappears — a stale row this job would otherwise never run to
      # catch. The dependency and PostCSS entries are here for the same reason at
      # a different layer: a React or Tailwind bump can move hydration timing or
      # gap resolution underneath every assertion in this suite.
      - "lib/**"
      - "fixtures/shows/**"
      - "supabase/seed*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "postcss.config.mjs"
      # THE JOB'S OWN RUNTIME. A change to the composite setup action, the
      # Supabase bootstrap script, or the migrations/config that bootstrap
      # applies can break or silently alter the environment these readings are
      # taken in; the build config decides what the measured pages even compile
      # to. A required probe that skips on those is not a probe.
      - ".github/actions/setup/**"
      # The diagram step's executed-count oracle. Its REQUIRED_PAIRS table names
      # case titles that live in the spec above, so an edit to either side alone
      # can retire a requirement — and a checker change that never re-runs this
      # job is a guard nobody has watched work. Both halves are listed: the CLI
      # wrapper and the module holding every decision it makes.
      - "scripts/check-phantom-gap-executed.mjs"
      - "scripts/lib/phantomGapExecuted.mjs"
      - "scripts/ci/supabase-local-bootstrap.sh"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "next.config.ts"
      - "tsconfig.json"
      - "pnpm-workspace.yaml"
  # Close-out verification without waiting for a matching PR (AGENTS.md:
  # "local-passes-CI-fails is its own bug class").
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  phantom-gap-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Mirrors published-modal-e2e.yml: the app, the test runner (signInAs →
      # supabaseAdmin), and db:seed all need the local Supabase env, and the
      # :3000 webServer command sets only the JWT/test-auth pair inline.
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      SUPABASE_URL: "http://127.0.0.1:54321"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
      SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
      SUPABASE_SECRET_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"
      SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"
      JWT_SIGNING_SECRET: "redeem-link-test-secret-32-bytes-min"
      HASH_FOR_LOG_PEPPER: "fxav-r41-test-pepper-32-chars-min-deterministic"
      GOOGLE_SERVICE_ACCOUNT_JSON: '{"client_email":"walker-fixture@seed-mode.iam.gserviceaccount.com"}'
      ENABLE_TEST_AUTH: "true"
      # MUST match the :3000 webServer's inline TEST_AUTH_SECRET — signInAs sends
      # this as Authorization: Bearer and the server compares against its own. The
      # crew describe ALSO sends it to unlock the X-Screenshot-Frozen-Now header.
      TEST_AUTH_SECRET: "fxav-m3-test-auth-2026-DO-NOT-SHIP"
      # Boot ONLY the :3000 baseline server (playwright.config.ts filter).
      BASELINE_SERVER_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not `latest`: `latest` resolves via the GitHub API and
          # rate-limits on shared runners. Matches published-modal-e2e.yml.
          version: 2.107.0
      - name: Install psql (signInAs admin client + bootstrap shell out to psql)
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Boot local Supabase (guarded migrations)
        run: bash scripts/ci/supabase-local-bootstrap.sh
      - name: Seed the corpus
        # Both mounts measure real rendered rows: the dashboard's non-vacuity
        # anchor is a shows-table ROW, and the crew describe resolves the Waldorf
        # show + its share token in beforeAll and throws without them.
        run: pnpm db:seed
      # The ARCHIVED bucket needs a row, and the base seed does not create one: its
      # `_locked_seed_ids` sweep deletes every `seed-fixture:%` show, this fixture
      # included. `walker-archived-2026` lives in the walker extension seed, so it
      # runs AFTER the base seed. Without this, T-NOPHANTOM-DASH [archived] measures
      # an empty bucket — which its exact-fixture gate fails on, by design.
      - name: Seed the archived fixture (walker extension)
        run: pnpm dlx tsx supabase/seedWalkerFixtures.ts
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: pnpm exec playwright install-deps chromium webkit
      - run: pnpm exec playwright install chromium webkit
      # `-g T-NOPHANTOM` covers BOTH admin mounts — the dashboard (…-DASH) and the
      # hydrated show modal at /admin?show=<slug> (…-SHOW). Deliberately the
      # prefix and not the two names: a probe case added to this file is picked
      # up without a workflow edit, which is the failure mode that left the host
      # specs dark in the first place.
      # The three standalone-config legs this job used to carry (phantomGapHelper.
      # layout, section-header-layout.layout, pusher-alignment.layout) moved to
      # standalone-e2e.yml, which runs the WHOLE config unfiltered on every PR.
      # They are members of that config, so they are strictly better covered
      # there: this job is path-filtered, which the coverage scanner correctly
      # refuses to count. What stays here is the real-mount work below, which the
      # standalone config cannot run.
      - name: Phantom-gap probe — /admin dashboard + show modal
        run: pnpm exec playwright test --reporter=list --project=desktop-chromium tests/e2e/admin-layout-dimensions.spec.ts -g "T-NOPHANTOM"
      - name: Phantom-gap probe — crew page
        run: pnpm exec playwright test --reporter=list --project=mobile-safari tests/e2e/crew-layout-dimensions.spec.ts -g "T-NOPHANTOM-CREW"
      # The width chain, which is what stops the two standalone steps above from
      # proving a counterfactual: they measure 15 header cells inside containers of
      # a fixed width per viewport, and this asserts the REAL mount produces exactly
      # those widths. Its own step rather than folded into the `-g "T-NOPHANTOM"`
      # filter above, because that filter would not match it — a spec matched by a
      # project but invoked by no step runs nowhere.
      - name: Section-header width chain (real route)
        run: pnpm exec playwright test --reporter=list --project=desktop-chromium tests/e2e/admin-layout-dimensions.spec.ts -g "width chain"
      # Its OWN step, for the reason the comment above gives: a case matched by a
      # project but selected by no `-g` filter runs NOWHERE. The freshness-cue
      # geometry case matches neither filter above, and the e2e coverage guard
      # tracks the FILE rather than the filters, so it cannot see that gap.
      - name: Freshness cue geometry (real route)
        run: pnpm exec playwright test --reporter=list --project=desktop-chromium tests/e2e/admin-layout-dimensions.spec.ts -g "T-FRESHNESS-GEOMETRY"
      # Its OWN step, for the same reason as the two above: the private-image-pipeline
      # cases live in crew-layout-dimensions.spec.ts but match NEITHER
      # `-g "T-NOPHANTOM-CREW"` nor any other filter this job runs, so without this
      # step they would be matched by a project and invoked by nothing — the
      # BL-E2E-APP-DEPENDENT-SPECS-CI-DARK shape this workflow exists to end.
      # They measure `next/image` `fill` geometry (image box vs its containing
      # block, thumbnails + BOTH lightbox tiers) and the network contract (every
      # thumbnail request is a manifest-listed variant; zero `/_next/image`), so
      # they need the seeded `diagram-snapshots` bucket this job already provisions
      # via `pnpm db:seed`. Spec: docs/superpowers/specs/crew/
      # 2026-08-09-private-image-pipeline-design.md §6/§9, AC-2 / AC-3 / AC-12.
      # BOTH projects since the zoom-gate arc (spec
      # docs/superpowers/specs/2026-08-10-diagram-viewing-polish.md §6): the
      # network-order gate that proves the ORIGINAL is not fetched before zoom
      # intent drives the component's keyboard zoom path and runs under
      # desktop-chromium; the CDP-free tier assertion runs under mobile-safari.
      # Neither project alone covers AC-1.
      #
      # Adding a project to this file is the move that manufactures false
      # coverage, and this arc had to defuse it twice over. The three pre-existing
      # cases CARRIED bare `if (testInfo.project.name !== "mobile-safari")
      # return;` gates, which would have "passed" under desktop-chromium in
      # milliseconds having asserted nothing; the same arc converted all three to
      # DECLARED `test.skip`, so that shape no longer exists in the file and the
      # run below reports 5 executed / 5 skipped rather than 8 green. The oracle
      # is the standing defence against it coming back: it asserts per
      # (case title, PROJECT) from this run's own json report, and requires only
      # the pairs that genuinely execute — so a bare return reintroduced later
      # cannot be credited, and a case that stops running cannot go dark.
      - name: Diagram gallery variant geometry + network gate (real route)
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/phantom-gap-diagrams-report.json
        run: pnpm exec playwright test --reporter=list,json --project=mobile-safari --project=desktop-chromium tests/e2e/crew-layout-dimensions.spec.ts -g "T-DIAGRAM-VARIANTS"
      # Post-run, and reading the run's OWN report: a runtime skip is a runtime
      # fact that no static wiring guard can see.
      - name: Diagram gallery cases really executed, per project
        run: node scripts/check-phantom-gap-executed.mjs
      - name: Upload Playwright traces/report (diagnosis artifact)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phantom-gap-e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
