name: App e2e (mobile-safari + desktop-chromium)
# Un-darkens batch 1 of BL-E2E-APP-DEPENDENT-SPECS-CI-DARK — nine specs that
# existed, matched a Playwright testMatch, and proved nothing on any PR (spec
# docs/superpowers/specs/ci/2026-08-09-app-e2e-batch1-design.md).
#
# The spec scoped NINE and wired SEVEN: two came out under AC-4, and neither
# may be re-added without its blocker closing first. Both blockers have since
# closed. help-pages.spec.ts: /help/tour's hydration mismatch was an MDX
# nesting defect, fixed 2026-08-10 (BL-HELP-TOUR-HYDRATION-MISMATCH, spec
# docs/superpowers/specs/2026-08-10-help-tour-hydration-fix.md).
# admin-changes-feed-layout.spec.ts re-enters 2026-08-15: its review modal
# never-mounting was NOT the filed cross-spec fixture collision (disproven —
# both failures hit the FIRST spec executed, before any other spec ran) but a
# transient Supabase gateway 502 on the foreground snapshot RPC, which the
# loader deliberately throws to the /admin error boundary, leaving the spec's
# modal wait to starve. It now opens the modal through a shared helper that
# recovers ONCE via the product's own Retry and surfaces every recovery as an
# annotation the executed-count oracle prints below (spec
# docs/superpowers/specs/ci/2026-08-15-changes-feed-modal-batch-flake-design.md,
# BL-CHANGES-FEED-MODAL-BATCH-FLAKE). Nine wired specs.
#
# BATCH 2 joins 2026-08-22 (spec docs/superpowers/specs/ci/2026-08-21-app-e2e-batch2-design.md,
# probe record docs/superpowers/specs/ci/probes/2026-08-21-app-e2e-batch2-membership-probe.md):
# fourteen more specs, membership derived from three real runs rather than from a
# reading — admin-parse-panel, admin-route-boundaries, admin-settings-admins-refresh,
# dev-capture, developer-tier, needs-attention-page, no-raw-codes,
# published-show-attention, roles-settings-layout, sign-in-page,
# source-link-dimensional, staged-preview, telemetry-layout, warning-panel-polish.
# Seven were green on a run; seven took a named test-only repair first (spec §6,
# R1-R7, plus R8/R9 which only became reachable once R1 and R7 unblocked their
# cases). The post-fix run of all 23 measured 181 executed identities in 3.2
# minutes locally, every per-spec count equal to Playwright's own resolution.
#
# This workflow is EXTENDED rather than duplicated (spec §1.1): batch 2's members
# have batch 1's requirement class exactly (the :3000 baseline server plus the
# seeded local Supabase), so a second workflow would pay a second cold build, a
# second Supabase bootstrap, a second oracle and a second wiring test to buy what
# the AC-4 fallback already buys.
#
# Deliberately NO pull_request filter of any kind — no paths, paths-ignore,
# types, or branches. Any configuration under `pull_request:` voids coverage
# under the scanner's bare-only rule (tests/ci/_workflowCoverageScan.ts), and
# the enumerate-a-filter approach was already disproved over four spec-review
# rounds on lifecycle-layout-e2e.yml: these specs' dependency graph is
# effectively the whole app.
#
# A NEW workflow rather than more steps on lifecycle-layout-e2e.yml, ratified
# 2026-08-09 after an explicit CI-cost trade: ~10-15 runner-minutes per PR
# bought for flake isolation from the already-wired lifecycle gate.
#
# workflow_dispatch is for POST-MERGE reruns only. GitHub exposes it solely for
# workflows already on the default branch, so it cannot start here until this
# file merges; AC-3's five-green bar is measured on pull_request runs, which is
# the stronger evidence anyway since it exercises the trigger the wiring claims.
#
# Shape mirrors lifecycle-layout-e2e.yml (native runner; behaviour + rect
# assertions, not pixel bytes, so no amd64 Docker raster pin).
# BASELINE_SERVER_ONLY boots ONLY the :3000 webServer (playwright.config.ts
# filter; the CREW_E2E_ONLY alias).
#
# help-pages.spec.ts resolves under mobile-safari only (playwright.config.ts
# testMatch), so the two-project invocation runs it once, not twice.
on:
  pull_request:
  workflow_dispatch:

# Concurrency, satisfying two guards at once — the comments sit ABOVE the block because
# tests/cross-cutting/ci-workflow-speedup.test.ts matches `group:` on the line immediately
# following `concurrency:`.
#
# GROUP is shape 1 of the two collision-safe shapes
# tests/ci/_metaEnvBoundExclusionCoverage.test.ts allows. The plan drafted
# `app-e2e-${{ github.workflow }}-${{ github.ref }}`; that guard refuses literal splicing AROUND
# ${{ github.workflow }} (its R6-B F2 case: splicing synthesized another workflow's exact
# registry group from individually-tame pieces), and the prefix buys nothing — github.workflow
# already resolves to this workflow's unique display name. ${{ github.ref }} keeps distinct PRs
# from cancelling each other.
#
# CANCEL is gated to pull_request because tests/cross-cutting/ci-workflow-speedup.test.ts
# requires that exact expression: a re-pushed PR cancels its stale run, while any NON-pull_request
# run is never cancelled. For THIS workflow the protected case is workflow_dispatch, since the
# triggers here are pull_request and workflow_dispatch only — there is deliberately no `push:` or
# `schedule:`, so nothing about post-merge main verification is promised or implied. (Coverage of
# main is a different question, and it is the branch-protection required-set promotion the ledger
# entry tracks as an owner action.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Same env contract as lifecycle-layout-e2e.yml / crew-e2e.yml: the app
      # (lib/supabase/server.ts / browser.ts default to "" and THROW if unset) +
      # the test runner (signInAs → supabaseAdmin) + db:seed all need the local
      # Supabase env; the :3000 webServer command sets only JWT/ADMIN_DEV/
      # ENABLE_TEST_AUTH/TEST_AUTH_SECRET inline, so the Supabase + build env
      # must be on the runner here. Demo local keys mirror playwright.config.ts's
      # webServer env blocks. Every (key, value) pair below byte-matches an
      # ENV_KEY_ALLOWLIST row in tests/ci/_workflowCoverageScan.ts — the scan
      # fails closed on a novel pair.
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      SUPABASE_URL: "http://127.0.0.1:54321"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
      SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
      SUPABASE_SECRET_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"
      SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"
      JWT_SIGNING_SECRET: "redeem-link-test-secret-32-bytes-min"
      # Subscriber-token mint (local supabase demo secret). Carried from the
      # sibling e2e workflows' env contract so an admin surface that opens the
      # realtime bridge cannot 500 the mint on a keyless runner.
      SUPABASE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      SUPABASE_REALTIME_ISS: supabase-demo
      # Same demo key as crew-e2e.yml. me-page.spec.ts signs in as NON_ADMIN_CREW
      # and follows crew links, which reaches the picker chain in a fresh
      # context; without this pickerCookieSigningKey() throws and
      # resolvePickerSelection fails closed (PICKER_RESOLVER_LOOKUP_FAILED).
      PICKER_COOKIE_SIGNING_KEY: "7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f7f"
      HASH_FOR_LOG_PEPPER: "fxav-r41-test-pepper-32-chars-min-deterministic"
      GOOGLE_SERVICE_ACCOUNT_JSON: '{"client_email":"walker-fixture@seed-mode.iam.gserviceaccount.com"}'
      ENABLE_TEST_AUTH: "true"
      # MUST match the :3000 webServer's inline TEST_AUTH_SECRET — signInAs
      # sends this as Authorization: Bearer and the server compares its own.
      TEST_AUTH_SECRET: "fxav-m3-test-auth-2026-DO-NOT-SHIP"
      # Boot ONLY the :3000 baseline server (playwright.config.ts filter).
      BASELINE_SERVER_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: supabase/setup-cli@v1
        with:
          # Pinned (NOT `latest`): `latest` resolves via the GitHub API, which
          # rate-limits on shared runners. 2.107.0 is the version
          # supabase-local-bootstrap.sh is known CI-passing with.
          version: 2.107.0
      - name: Install psql (signInAs admin client + bootstrap shell out to psql)
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Boot local Supabase (guarded migrations)
        run: bash scripts/ci/supabase-local-bootstrap.sh
      - name: Seed fixture shows (report-modal reads the Waldorf show)
        run: pnpm db:seed
      # The mobile-safari project spreads devices["iPhone 14"] → webkit (NOT
      # chromium). Install BOTH so a chromium-defaulting spec can't fail either.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: pnpm exec playwright install-deps chromium webkit
      - run: pnpm exec playwright install chromium webkit
      # ONE invocation: each Playwright process cold-builds and owns its
      # webServer (pnpm build && pnpm start in CI), so per-project or per-spec
      # steps would pay that cost repeatedly. Each project's testMatch claims
      # its own subset of the named files.
      #
      # --retries=0 is load-bearing, not decoration: playwright.config.ts sets
      # `retries: process.env.CI ? 2 : 0`, so without the flag a fail-then-pass
      # retry would read as a green run and silently defeat AC-3's zero-retry
      # bar. The flag pins first-attempt semantics in the one place the job runs.
      - name: Run app-e2e (both projects; each project's testMatch claims its own subset)
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/app-e2e-report.json
          # DATABASE_URL, not TEST_DATABASE_URL: the latter is this repo's name for
          # the REMOTE validation project, and pointing it at the local stack here
          # would read as that (the rationale lifecycle-layout-e2e.yml:193 records
          # for the same pair). Batch 2's members reach the app's postgres.js paths
          # — the staged discard route, the wizard's session lifecycle, the staged
          # flows in needs-attention-page — and those resolve
          # `TEST_DATABASE_URL ?? DATABASE_URL` and THROW under production posture
          # when neither is set, which is what `pnpm build && pnpm start` is here.
          # Batch 1's nine never reached them, which is why this job carried no DSN
          # until now (spec §5.2; the same split-brain contaminated the local
          # membership probe, probe record §4.3).
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm exec playwright test tests/e2e/sample.spec.ts tests/e2e/root-landing.spec.ts tests/e2e/admin-layout.spec.ts tests/e2e/admin-phase2-surfaces.spec.ts tests/e2e/notify-toggles.spec.ts tests/e2e/me-page.spec.ts tests/e2e/report-modal.spec.ts tests/e2e/help-pages.spec.ts tests/e2e/admin-changes-feed-layout.spec.ts tests/e2e/developer-tier.spec.ts tests/e2e/source-link-dimensional.spec.ts tests/e2e/staged-preview.spec.ts tests/e2e/telemetry-layout.spec.ts tests/e2e/admin-parse-panel.spec.ts tests/e2e/dev-capture.spec.ts tests/e2e/published-show-attention.spec.ts tests/e2e/no-raw-codes.spec.ts tests/e2e/sign-in-page.spec.ts tests/e2e/admin-route-boundaries.spec.ts tests/e2e/needs-attention-page.spec.ts tests/e2e/roles-settings-layout.spec.ts tests/e2e/admin-settings-admins-refresh.spec.ts tests/e2e/warning-panel-polish.spec.ts --project=mobile-safari --project=desktop-chromium --retries=0 --reporter=list,json
      # No `if:` — this must run on the success path, which is the only path
      # where a vacuously-green run is dangerous. A runtime `test.skip()` skips
      # every case while --list still reports them, so the run exits 0 having
      # proved nothing; this reads the run's OWN report and enforces a per-spec
      # executed floor measured from a real run.
      - name: Executed-count oracle (runtime skips cannot fake green)
        run: node scripts/check-app-e2e-executed.mjs
      - name: Upload Playwright traces/report (diagnosis artifact)
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: app-e2e-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            playwright-report/
            test-results/
          retention-days: 7
