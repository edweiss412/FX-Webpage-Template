name: Unit + DB suite (full vitest gate)
# Root-cause fix for the "no CI gate runs the full `pnpm test` suite" gap:
# before this job, the workflows only ran TARGETED vitest files (x-audits,
# deep-link-walker, postgrest-dml-lockdown, affordance-matrix). The 6800+
# unit/DB tests that implementers + reviewers rely on for "all green" were
# NOT gated, so PRs merged with failing/stale tests undetected.
#
# TOPOLOGY — split by PROJECT, not by file (2026-07-20).
#
# The suite has two vitest projects (vitest.projects.ts): `serial`, which is
# DB-bound and runs fileParallelism:false, and `parallel`, whose files were
# verified to touch no database at all. Until now BOTH ran in every leg, so
# every leg booted Supabase — including for the ~294s of work that never opens
# a connection.
#
# Now they are separate matrix jobs:
#   unit-suite-db   — 8 legs, boots Supabase, runs ONLY --project=serial
#   unit-suite-nodb — 3 legs, boots NOTHING,  runs ONLY --project=parallel
#
# The no-DB legs skip supabase/setup-cli, the psql install, and the ~71s
# bootstrap entirely, cutting their fixed overhead from ~100s to ~30s. That
# saving is the entire point of the split; the topology meta-test fails if the
# no-DB job so much as mentions the bootstrap.
#
# Measured, not modelled (CI probe run 29758568301, one runner per project,
# whole project, no sharding): serial 690s, parallel 294s. Those two total 984s
# against the 1,264s the previous 8 mixed legs spent on vitest — the ~280s gap
# is per-leg startup and transform work, re-paid by every leg, which is why leg
# counts past ~12 stop buying anything.
#
# LEG COUNTS ARE SET BY RUNNER CONCURRENCY, NOT BY THE ARITHMETIC, AND THE
# PERFORMANCE WIN HERE IS SMALL. Four topologies were measured on PR #517
# against a like-for-like PR baseline (run 29754822376):
#
#   config                      stagger  max leg  WALL
#   8 mixed (baseline)              3s     253s   262s
#   12+4  (run 29760670825)       171s     182s   342s  <- REGRESSED
#   8+3   (run 29761339451)        43s     195s   246s  <- best
#   6+2   (run 29761927532)        15s     246s   256s
#
# 12+4 hit its per-leg target exactly (182s) and still lost, because 16 legs
# cannot all start at once: the last began after the whole baseline run would
# have finished. Shrinking to 6+2 removed the stagger but gave the per-leg gain
# straight back. 8+3 is the measured optimum at ~6% off the wall -- far short of
# the ~27% the arithmetic projected, because per-leg startup (~35s) and runner
# queueing both scale against added legs.
#
# The durable value of this split is therefore NOT the 16s. It is that
# unit-suite-nodb runs the whole parallel project with no database on every PR,
# which is what catches a DB-touching file drifting into a parallel dir -- the
# bug this change was born from.
#
# COVERAGE: `--project` plus `--shard` must not drop files. Two guarantees
# compose. vitest-projects-partition.test.ts pins that every non-nightly test
# file lands in exactly ONE default project; unit-suite-shard-topology.test.ts
# pins that each job runs exactly one project and that each job's --shard
# denominator equals its own matrix length. Together: every file runs exactly
# once. A red leg cannot green the gate — the aggregator `unit-suite` (the
# REQUIRED check-context name) needs BOTH jobs and fails unless BOTH rolled up
# success.
#
# ONE file is EXCLUDED via VITEST_EXCLUDE_ENV_BOUND=1 (a project-level
# exclude in vitest.config.ts) — they need environments this local-bootstrap
# runner cannot provide, or starve under full-suite concurrency. (That rationale
# once said "the 2-core runner"; measured 2026-07-20, these runners are 4-core /
# 15.6 GiB AMD EPYC — public-repo runners were upgraded. The starvation reason
# stands on its own; the core count was stale and had already been cited as
# grounds for a since-retracted optimization proposal.) Each excluded file is
# gated elsewhere, so excluding them here is not a regression:
# (pg-cron-coverage was the third until 2026-07-26 and now RUNS here. Its
# exclusion rested on a false premise recorded in this very comment — "the
# bootstrap holds aside the GUC-guarded pg_cron migrations, so no cron jobs
# exist locally". supabase-local-bootstrap.sh holds them aside for the INITIAL
# boot only, then applies them with `supabase migration up --include-all`, so
# this job has always had a Postgres whose cron.job rows were produced by
# PostgreSQL parsing this branch's SQL. Under CI the suite now throws rather
# than skipping when psql is unreachable, and asserts a non-zero live-case
# count, so it cannot report success without touching the database.
# test-auth-gate was the second exclusion until 2026-07-31 [PR-B of the
# ci-dark descoped close-out] and now RUNS here — 24 passed / 3 skipped,
# 5x stability-looped before its row came out.)
#   - tests/cross-cutting/email-canonicalization.test.ts — 15s per-test
#     doc-scans that starve under concurrency; execution proven by the x5
#     job's verbatim `pnpm run-excluded` step (ENV_BOUND_COVERAGE_REGISTRY,
#     verified by tests/ci/_metaEnvBoundExclusionCoverage.test.ts).
# It MUST be the env var, NOT `vitest run --exclude` — vitest IGNORES the CLI
# `--exclude` flag once a project defines its own `exclude` (the serial project
# does). The gate keeps those files runnable by x-audits' direct
# `vitest run <file>` and by local `pnpm test`.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: unit-suite-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-suite-db:
    name: unit-suite-db
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      # tests/scripts/ledgerMass.test.ts cross-checks the frozen ledger fixture
      # against the SAME blobs read back out of git history, so the oracle cannot
      # be made to pass by editing the fixture. actions/checkout defaults to
      # fetch-depth: 1, which does not carry that commit, and the test FAILS
      # (never skips) when it is unreachable. Depth-1 on this ONE object, not
      # fetch-depth: 0 — full history would regress the unit-suite wall-clock
      # work that took this gate from 9.1 to ~4.2 minutes. Fetch-by-SHA needs the
      # full 40 chars. The rev is pinned to the fixture's by that same test, so
      # regenerating the fixture at a new date fails until this line follows.
      - name: Fetch the frozen-ledger fixture rev for the ledger-mass oracle
        run: git fetch --no-tags --depth=1 origin 8d78cdf13f4e3844c6c596bc94801f73204c234f
      - uses: ./.github/actions/setup
      - uses: supabase/setup-cli@v1
        with:
          # Pinned (NOT `latest`): `latest` resolves via the GitHub API, which
          # rate-limits on shared runners and fails setup. unit-suite is a
          # REQUIRED check, so a setup rate-limit flake would block merges.
          # 2.107.0 = the supabase-local-bootstrap.sh known CI-passing version.
          version: 2.107.0
      - name: Install psql (local-DB tests + bootstrap shell out to psql)
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Boot local Supabase (guarded migrations)
        # Shared bootstrap — same Supabase + GUC + guarded-migration setup
        # dev-gate-e2e.yml / screenshots-drift.yml use, so the hold-aside list
        # cannot drift between workflows. Each matrix leg boots its OWN instance.
        run: bash scripts/ci/supabase-local-bootstrap.sh
      - name: Refuse node-killing pnpm settings (composite, pre-node, defaults-immune)
        uses: ./.github/actions/assert-pnpm-sources
      - name: Run serial project, shard ${{ matrix.shard }}/8
        # fileParallelism:false still holds WITHIN a leg, and legs never share a
        # database (separate runners), so the serial-DB guarantee is unchanged.
        env:
          VITEST_EXCLUDE_ENV_BOUND: "1"
        run: pnpm exec vitest run --project=serial --shard=${{ matrix.shard }}/8

  unit-suite-nodb:
    name: unit-suite-nodb
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      # tests/adminAlerts/_metaResolveIntentLifecycle.test.ts compares the
      # resolve-intent baseline against origin/main, and FAILS (never skips) in
      # CI when the ref is unresolvable. actions/checkout defaults to
      # fetch-depth: 1, which does not provide it. Depth-1 on this ONE ref, not
      # fetch-depth: 0 — full history would regress the unit-suite wall-clock
      # work that took this gate from 9.1 to ~4.2 minutes.
      # The refspec is FORCED. This clone is shallow, so refs/remotes/origin/main is
      # the checked-out commit with its ancestry grafted away; when main advances
      # between checkout and this step git cannot prove a fast-forward and rejects
      # the update ("! [rejected] main -> origin/main (non-fast-forward)"), exiting 1
      # and failing a REQUIRED check on an unrelated diff (run 31904542867). Forcing
      # is safe precisely because this ref is disposable CI state, never a branch.
      - name: Fetch origin/main for the resolve-intent lifecycle gate
        run: git fetch --no-tags --depth=1 origin +main:refs/remotes/origin/main
      - uses: ./.github/actions/setup
      # No supabase/setup-cli, no psql, no bootstrap — deliberately. The parallel
      # project touches no database (CI probe run 29758568301 ran all 693 of its
      # files against a runner with none installed; the only two that failed were
      # moved to serial in the same change). Adding a boot here would silently
      # hand back the ~71s per leg this job exists to save, so the topology
      # meta-test asserts this job never mentions the bootstrap.
      - name: Refuse node-killing pnpm settings (composite, pre-node, defaults-immune)
        uses: ./.github/actions/assert-pnpm-sources
      # tests/help/ holds three suites that drive a REAL page — captureRefusal,
      # captureSelectorAbsent and renderFaultDetector each `chromium.launch()`,
      # because the capture's refusal layers and the fault detector are DOM
      # readers and a stub would test the stub. tests/help/** is a parallel
      # glob, so those files land here and nowhere else, and this job had no
      # browser: the first CI run after they were added failed with
      # `browserType.launch: Executable doesn't exist`, while every local run
      # passed on an installed browser. Local-passes-CI-fails, exactly the class
      # AGENTS.md flags — the machine that runs the suite is part of the suite.
      #
      # The failing run named only two of the three; the third sits in another
      # shard that had not reached it yet. The fix is per-JOB, so it covers the
      # class rather than the two files the log happened to name.
      #
      # chromium only. The db legs never run the parallel project, so they need
      # nothing, and webkit is not launched by any file in this project.
      #
      # NO actions/cache here, deliberately. The e2e workflows cache
      # ~/.cache/ms-playwright, but unit-suite-shard-topology.test.ts asserts
      # this job uses EXACTLY three actions — checkout, setup, and the
      # pnpm-sources guard — because "a fourth is how a database bring-up would
      # return". A cache action is a fourth, and widening a guard that exists to
      # keep a database out of this job, in order to save a download, is a bad
      # trade. These are `run:` steps, so the count is untouched and the guard
      # keeps meaning what it says.
      - run: pnpm exec playwright install-deps chromium
      - run: pnpm exec playwright install chromium
      - name: Run parallel project, shard ${{ matrix.shard }}/3
        env:
          VITEST_EXCLUDE_ENV_BOUND: "1"
        run: pnpm exec vitest run --project=parallel --shard=${{ matrix.shard }}/3

  unit-suite:
    # Aggregator — PRESERVES the `unit-suite` required check-context name so
    # branch protection needs no change. Green only when EVERY leg of BOTH
    # matrix jobs passed (needs.<job>.result is `success` iff all its legs
    # succeeded). `if: always()` runs it even when a leg fails, so the required
    # context reports an explicit failure rather than a never-reported skip.
    #
    # Both results are checked. Gating on only one would silently stop half the
    # suite from blocking merges while the check still reported green.
    name: unit-suite
    needs: [unit-suite-db, unit-suite-nodb]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every leg of both matrix jobs to have succeeded
        run: |
          db='${{ needs.unit-suite-db.result }}'
          nodb='${{ needs.unit-suite-nodb.result }}'
          echo "unit-suite-db rollup:   $db"
          echo "unit-suite-nodb rollup: $nodb"
          test "$db" = "success"
          test "$nodb" = "success"
