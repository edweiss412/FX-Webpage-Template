name: Attention pill focus e2e (standalone harness)
# Runs the standalone real-browser attention-menu spec
# (tests/e2e/attention-pill-focus.spec.ts, standalone-chromium project) in real
# Chromium. The spec is FULLY self-contained: its beforeAll esbuild-bundles the live
# entry via tests/e2e/_step3ReviewModalBundle.mjs (Next "use server" elision + empty
# node builtins), compiles the token CSS with the Tailwind CLI, and serves it over its
# OWN node:http server — no app boot, no Supabase, no :3000-:3004.
#
# Why its own job: standalone.config.ts is an explicit allow-list that NO general CI
# workflow invokes, so this spec ran NOWHERE despite collecting 20+ tests — it was
# recorded UNSEEN in the coverage registry. It is the ONLY harness in which the
# attention menu can actually be open (the layout spec is static-render, no
# hydration), so it carries the focus-rescue, dimensional, and transition coverage
# for that surface. workflow_dispatch so close-out can fire it via `gh workflow run`.
#
# The path filter is the complete DIRECT input set, not a copy of the
# attention-anchor template — that template omits tsconfig.json even though its own
# live bundle passes it to esbuild. Pinned by tests/ci/attentionPillFocusWorkflow.test.ts.
on:
  pull_request:
    paths:
      - "tests/e2e/attention-pill-focus.spec.ts"
      - "tests/e2e/_pillFocusLiveEntry.tsx"
      - "tests/e2e/_publishedReviewModalHarness.tsx"
      - "tests/e2e/_step3ReviewModalBundle.mjs"
      - "tests/e2e/standalone.config.ts"
      - "tsconfig.json"
      - "components/admin/showpage/AttentionMenu.tsx"
      - "components/admin/showpage/PublishedReviewModal.tsx"
      - "app/globals.css"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/attention-pill-focus-e2e.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  attention-pill-focus-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: pnpm exec playwright install-deps chromium
      - run: pnpm exec playwright install chromium
      - name: Run attention-pill-focus standalone spec (no webServer)
        run: pnpm test:e2e:attention-pill-focus
      - name: Upload Playwright traces/report (diagnosis artifact)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: attention-pill-focus-e2e-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            playwright-report/
            test-results/
          retention-days: 7
