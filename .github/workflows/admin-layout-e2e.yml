name: Admin layout e2e (desktop-chromium)
# Runs the admin shell's real-browser specs against a real browser and a seeded
# local Supabase. Two are dimensional-invariant specs; the third is behavioral:
#   - tests/e2e/bell-panel-layout.spec.ts          (alert bell geometry + transitions)
#   - tests/e2e/admin-nav-layout-dimensions.spec.ts (nav chrome across the breakpoint)
#   - tests/e2e/nojs-loading-notice.spec.ts        (LoadingShell's no-JavaScript branch)
#   - tests/e2e/rowactions-geometry.spec.ts        (dashboard row ⋮ menu: portal
#     containment on the last row, vertical flip, window-scroll dismiss, and the
#     no-orphaned-portal compound row — all invisible to jsdom, which computes
#     no layout at all)
#
# Why this job exists: the spec ran in NO workflow. `desktop-chromium` is invoked
# only by step3-live-bundle.yml, and only for its own spec, so this gate has been
# dark since it was written. It went unnoticed that /admin shipped a 104-143px
# document horizontal overflow (closed HoverHelp popovers kept a layout box under
# `visibility:hidden`) — the spec asserts exactly that and would have caught it on
# the commit that introduced it. Same class as the drift step3-live-bundle.yml was
# created to close (#479): a spec in a project no workflow runs is a spec that
# silently rots.
#
# What it protects: panel geometry across the 420px cap + 640px sm breakpoint, the
# unread-dot no-layout-shift invariant, severity grouping, the shared timestamp /
# Dismiss right edge and the 28px chevron gutter's bled 44px tap target, the nav
# chrome sweep across the 840px breakpoint band (including 768, inside the range
# that used to overflow), and document-level horizontal overflow on /admin. Plus
# the no-JavaScript branch of LoadingShell: with scripting disabled the streaming
# reveal never runs, so the notice must show and the shell content must be hidden
# by the <noscript>-scoped rule — and a JS-on control proves neither reaches a
# visitor who has JavaScript. That one is a behavioral assertion, not a rect.
#
# Shape mirrors crew-e2e.yml (native runner + chromium; this spec asserts rects and
# behavior, NOT pixel bytes, so the amd64 Docker raster pin used by
# screenshots-drift.yml is not needed). BASELINE_SERVER_ONLY=1 boots ONLY the :3000
# webServer (playwright.config.ts filter) so the :3001-:3004 build-gate servers
# don't cold-build. workflow_dispatch so close-out can fire it via
# `gh workflow run` — real-CI-green is its own gate (the local-passes-CI-fails class).
on:
  pull_request:
    paths:
      - "components/admin/BellPanel.tsx"
      - "components/admin/nav/**"
      - "app/admin/layout.tsx"
      - "components/admin/nav/NotifBell.tsx"
      - "components/admin/HoverHelp.tsx"
      - "lib/admin/bellTriage.ts"
      - "lib/admin/bellFeed.ts"
      - "app/api/admin/alerts/bell/**"
      - "tests/e2e/bell-panel-layout.spec.ts"
      - "tests/e2e/admin-nav-layout-dimensions.spec.ts"
      # The no-JS notice lives in the shared LoadingShell, so the trigger has
      # to name that component: a PR touching only Skeleton.tsx would otherwise
      # not match any path here and this gate would run dark against the exact
      # file it guards -- the same "matched by a project but invoked by no
      # step" class this workflow's header was written about.
      - "components/layout/Skeleton.tsx"
      - "tests/e2e/nojs-loading-notice.spec.ts"
      - "tests/e2e/needs-attention-holds.spec.ts"
      - "tests/e2e/rowactions-geometry.spec.ts"
      # Every production surface the row-actions geometry depends on. A menu
      # that stops flipping, stops being contained, or stops dismissing on
      # scroll is a change to ONE of these; naming only the spec would leave
      # this gate dark against the exact files it guards.
      - "components/admin/ShowRowActions.tsx"
      - "components/admin/AnchoredPortal.tsx"
      - "components/admin/ShowsTable.tsx"
      # The composed placement core: the flip, the bounds and the visual-viewport
      # gate all live here, not in the component.
      - "lib/popover/place.ts"
      - "lib/popover/position.ts"
      - "lib/popover/viewport.ts"
      - "lib/popover/rafCoalescer.ts"
      # Scroll-neutral measurement: every capped panel this gate exercises is
      # measured through this helper, so a change to it can revert a reveal.
      - "lib/popover/naturalSize.ts"
      # The geometry spec measures the Archive confirm and the held decision,
      # and BOTH panels are sized by their copy. A copy-only edit can therefore
      # break containment, so the modules that spell those sentences trigger the
      # gate too — naming only the components would leave that path dark.
      - "lib/admin/archiveCopy.ts"
      - "lib/admin/syncRequest.ts"
      # Row geometry consumes --spacing-tap-min directly: the 44px floor sizes
      # the trigger, every menu item and therefore the panels the geometry spec
      # measures. A token edit can break containment, so the file that DEFINES
      # the token triggers the gate too.
      - "app/globals.css"
      # Every production surface the needs-attention holds rollup touches: a
      # later regression in any of them must not leave the holds spec dark.
      - "lib/admin/identityHolds.ts"
      - "lib/admin/needsAttention.ts"
      - "lib/admin/loadNeedsAttention.ts"
      - "lib/admin/needsAttentionCount.ts"
      - "components/admin/NeedsAttentionInbox.tsx"
      - "components/admin/NeedsAttentionSummaryCard.tsx"
      - "components/admin/IdentityHoldDisclosure.tsx"
      - "components/admin/Dashboard.tsx"
      - "app/admin/needs-attention/page.tsx"
      - "lib/notify/digest.ts"
      - "lib/notify/runNotify.ts"
      - "app/help/admin/dashboard/page.mdx"
      - "app/help/admin/review-queues/page.mdx"
      - "app/help/daily-rhythm/page.mdx"
      - "app/help/admin/settings/page.mdx"
      - "app/help/tour/page.mdx"
      - "tests/e2e/helpers/**"
      - "playwright.config.ts"
      - ".github/workflows/admin-layout-e2e.yml"
  workflow_dispatch:

# Cancel a superseded run when the PR branch is re-pushed — this job boots
# Supabase + seeds + Playwright, so a stale run holds a heavy runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  admin-layout-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # The admin app (lib/supabase/server.ts / browser.ts default to "" and THROW
      # if unset) + the test runner (signInAs → supabaseAdmin, the admin_alerts
      # seeding, settleDashboardAdminState) + db:seed all need the local Supabase
      # env. The :3000 webServer command sets only
      # JWT/ADMIN_DEV/ENABLE_TEST_AUTH/TEST_AUTH_SECRET inline, so the Supabase +
      # build env must be on the runner here (inherited by db:seed, the Playwright
      # workers, AND the spawned :3000 build/start). Demo local keys mirror the
      # :3004 webServer env block in playwright.config.ts.
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      SUPABASE_URL: "http://127.0.0.1:54321"
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
      SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
      SUPABASE_SECRET_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"
      SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU"
      JWT_SIGNING_SECRET: "redeem-link-test-secret-32-bytes-min"
      HASH_FOR_LOG_PEPPER: "fxav-r41-test-pepper-32-chars-min-deterministic"
      GOOGLE_SERVICE_ACCOUNT_JSON: '{"client_email":"walker-fixture@seed-mode.iam.gserviceaccount.com"}'
      ENABLE_TEST_AUTH: "true"
      # MUST match the :3000 webServer's inline TEST_AUTH_SECRET — signInAs sends
      # this as Authorization: Bearer and the server compares against its own.
      TEST_AUTH_SECRET: "fxav-m3-test-auth-2026-DO-NOT-SHIP"
      # Boot ONLY the :3000 baseline server (playwright.config.ts filter).
      BASELINE_SERVER_ONLY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: supabase/setup-cli@v1
        with:
          # Pinned (NOT `latest`): `latest` resolves the newest release via the
          # GitHub API, which rate-limits on shared runners and fails setup before
          # the build. 2.107.0 is the version supabase-local-bootstrap.sh is known
          # CI-passing on (see crew-e2e.yml).
          version: 2.107.0
      - name: Install psql (signInAs admin client + bootstrap shell out to psql)
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Boot local Supabase (guarded migrations)
        run: bash scripts/ci/supabase-local-bootstrap.sh
      - name: Seed the corpus
        # The spec seeds its OWN shows + alerts, but /admin's dashboard branch
        # (and therefore the nav bell) needs a settled app_settings row; the spec's
        # beforeAll pins that via settleDashboardAdminState, and db:seed supplies
        # the surrounding fixture corpus the dashboard renders around it.
        run: pnpm db:seed
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      # Split from `install --with-deps`: install-deps (apt) always runs, but the
      # browser binaries are restored from the cache above on a hit.
      - run: pnpm exec playwright install-deps chromium
      - run: pnpm exec playwright install chromium
      - name: Run admin layout e2e (desktop-chromium, :3000 only)
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results/admin-layout-e2e-report.json
        run: pnpm exec playwright test --reporter=list,json --project=desktop-chromium tests/e2e/bell-panel-layout.spec.ts tests/e2e/admin-nav-layout-dimensions.spec.ts tests/e2e/nojs-loading-notice.spec.ts tests/e2e/needs-attention-holds.spec.ts tests/e2e/rowactions-geometry.spec.ts
      # Informational, never a gate (spec §4.3). `if: always()` is load-bearing: without it
      # this is an ordinary prerequisite-gated step, so a run that RECOVERS and then fails a
      # downstream assertion skips the print entirely — the recovery happened, the list
      # reporter prints no annotations, and a failed run's artifact is not where an operator
      # looks first. The printer always exits 0, so `always()` cannot convert a red run green;
      # the Playwright step's own status remains this job's verdict.
      - name: Print infra-recovery annotations (admin-layout)
        if: always()
        run: node scripts/print-infra-recoveries.mjs --report test-results/admin-layout-e2e-report.json
      - name: Upload Playwright traces/report (diagnosis artifact)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: admin-layout-e2e-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            playwright-report/
            test-results/
          retention-days: 7
