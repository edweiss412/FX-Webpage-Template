name: Screenshots drift

on:
  # Per-PR, run only when a render input could have changed — this job boots
  # Supabase + a Docker Playwright image (~280s), so firing it on PRs that touch
  # no rendered surface is pure waste. Captured surfaces are the admin routes
  # (manifest in scripts/help-screenshots.manifest.ts) rendered from the seeded
  # fixtures → parser → seed pipeline, so the allow-list spans both the render
  # side (app/**, components/**, globals.css via app/**) and the data side.
  # The `schedule` cron below stays UNFILTERED and is the full-coverage backstop
  # that catches drift on any PR this allow-list skipped (do not narrow it).
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/data/**"
      - "lib/audit/**"
      - "lib/admin/**"
      - "lib/messages/**"
      - "lib/parser/**"
      - "fixtures/shows/**"
      - "supabase/seed.ts"
      - "supabase/seedWalkerFixtures.ts"
      - "supabase/migrations/**"
      # The FONT is a screenshot input: changing it re-rasterises every glyph in
      # every capture. It lived under app/** until 2026-08-03, when the
      # page-candidate tripwire moved it out and silently took it off this
      # filter with it (whole-diff review R4).
      - "public/fonts/**"
      # The committed baselines themselves: the drift job re-captures and
      # `git diff --exit-code public/help/screenshots/`, so a PR that edits these
      # bytes directly must re-trigger verification (else a bad baseline ships
      # until the nightly cron). They are the comparison target, not just an input.
      - "public/help/screenshots/**"
      - "scripts/capture-core.ts"
      - "scripts/help-screenshots.ts"
      - "scripts/help-screenshots.manifest.ts"
      - "scripts/help-screenshots-fixture-range.ts"
      - "scripts/capture-launch-args.ts"
      - "scripts/ci/**"
      - "playwright.screenshots.config.ts"
      - "tests/e2e/helpers/**"
      - ".github/workflows/screenshots-drift.yml"
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

# Cancel a superseded run when the PR branch is re-pushed — this job boots
# Supabase + a Docker Playwright image, so a stale run holds a heavy runner.
# Including github.event_name keeps the nightly `schedule` run from ever sharing
# a group with a PR/dispatch run, so the full-coverage backstop can't be cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  screenshots-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: supabase/setup-cli@v1
        with:
          # Pinned (NOT `latest`): `latest` resolves via the GitHub API, which rate-limits
          # on shared runners and fails setup. 2.107.0 = the supabase-local-bootstrap.sh
          # known CI-passing version (PR #102; older 2.98.2 broke the in-container psql auth); a fixed version downloads directly (no API lookup).
          version: 2.107.0
      - name: Start Supabase (supply cron-schedule GUC; local-only placeholder)
        # Guarded-migration boot lives in the shared script (M12.12 Task 14) so
        # the hold-aside list cannot drift between workflows. Full rationale +
        # mechanism comments are in the script.
        run: bash scripts/ci/supabase-local-bootstrap.sh
      # Restore the Next compiler cache for the :3004 screenshots-help webServer
      # build (playwright.screenshots.config.ts runs `pnpm build` with
      # NEXT_DIST_DIR=.next-screenshots-help -> next.config distDir), so a warm
      # build skips recompiling unchanged modules (~30s). Caches ONLY
      # <distDir>/cache (the compiler cache, NOT build output). Separate key
      # namespace from help-affordances' `nextcache-help`: this build carries a
      # different env (ADMIN_DEV_PANEL_ENABLED, screenshot fixtures) so the two
      # jobs must not share compilation artifacts.
      #
      # EXACT INPUT-HASH KEY, NO FALLBACK
      # (BL-SCREENSHOTS-DRIFT-STALE-NEXTCACHE-SELF-PERPETUATING). The previous
      # key was suffixed with `github.sha` and carried two prefix `restore-keys`,
      # so a run whose inputs had moved still prefix-restored an older cache. An
      # earlier comment here claimed a warm build reuses identical compilation so
      # rendered pixels are unchanged; that was REFUTED live on 2026-08-14 — two
      # same-sha drift runs rendered old chrome from a restored cache while the
      # no-cache regen workflow reproduced the committed bytes exactly.
      #
      # So the key now hashes the render inputs themselves and has NO fallback: a
      # hit means the cached compilation was built from byte-identical inputs, so
      # reuse is sound BY KEY CONSTRUCTION rather than by trusting Next's
      # invalidation. A miss builds cold (~30s), the correct price for changed
      # inputs. The census is this workflow's own `pull_request.paths` filter
      # MINUS `public/help/screenshots/**` (the capture step mutates those bytes
      # mid-run and they are the comparison TARGET, not a compiler input) PLUS
      # three compiler inputs that are not PR-filter entries. One derivation:
      # tests/cross-cutting/ci-workflow-speedup.test.ts asserts key-globs ==
      # filter-globs - baselines + extras, so the two cannot drift apart.
      #
      # The `-v2-` namespace makes every pre-existing (including poisoned)
      # `Linux-nextcache-screenshots-*` entry unreachable by construction,
      # without anyone running `gh cache delete`.
      - name: Restore Next build cache (screenshots-help :3004 build)
        id: nextcache-restore
        uses: actions/cache/restore@v4
        with:
          path: .next-screenshots-help/cache
          key: ${{ runner.os }}-nextcache-screenshots-v2-${{ hashFiles('app/**', 'components/**', 'lib/data/**', 'lib/audit/**', 'lib/admin/**', 'lib/messages/**', 'lib/parser/**', 'fixtures/shows/**', 'supabase/seed.ts', 'supabase/seedWalkerFixtures.ts', 'supabase/migrations/**', 'public/fonts/**', 'scripts/capture-core.ts', 'scripts/help-screenshots.ts', 'scripts/help-screenshots.manifest.ts', 'scripts/help-screenshots-fixture-range.ts', 'scripts/capture-launch-args.ts', 'scripts/ci/**', 'playwright.screenshots.config.ts', 'tests/e2e/helpers/**', '.github/workflows/screenshots-drift.yml', 'pnpm-lock.yaml', 'next.config.ts', 'package.json') }}
      - name: Capture screenshots in pinned Playwright image
        run: |
          docker run --rm --platform linux/amd64 --network host \
            -v "$PWD:/work" \
            -w /work \
            -e CI=true \
            mcr.microsoft.com/playwright:v1.59.1-jammy \
            bash -lc "apt-get update && apt-get install -y postgresql-client && corepack enable && pnpm screenshot:help"
      # The Docker build ran as root, so .next-screenshots-help/cache is now
      # root-owned; the explicit save step below runs as the runner user and
      # cannot read root-owned files. Reclaim ownership before it, `if: always()`
      # so a drift failure still leaves a saveable cache. ubuntu-latest grants
      # passwordless sudo.
      - name: Reclaim Next cache ownership (Docker built it as root)
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .next-screenshots-help/cache 2>/dev/null || true
      # ONE aggregated check. Both name lists are computed FIRST with
      # name-listing commands (no early exit), every name from both is printed,
      # and the script exits once at the end. The previous form hid untracked
      # capture filenames behind `test -z "$(git ls-files --others ...)"` (probed:
      # status=1, zero bytes of output), and its fail-fast `git diff --exit-code`
      # exited before any later branch ran — so with both kinds of drift present
      # only the tracked name was ever printed.
      - name: Check screenshot drift
        run: |
          tracked=$(git diff --name-only public/help/screenshots/)
          untracked=$(git ls-files --others --exclude-standard public/help/screenshots/)
          if [ -n "$tracked" ]; then
            echo "Drifted (tracked) screenshots:"
            echo "$tracked"
            git --no-pager diff --stat public/help/screenshots/
          fi
          if [ -n "$untracked" ]; then
            echo "New (untracked) captures:"
            echo "$untracked"
          fi
          if [ -n "$tracked" ] || [ -n "$untracked" ]; then
            exit 1
          fi
      # Save the compiler cache under the key computed ONCE at restore time and
      # reused here BY REFERENCE. Never re-evaluate a content-derived key after
      # the job has mutated the tree: `hashFiles` would re-run at save time and a
      # drifting run would save under a phantom key no checkout ever requests.
      #
      # `if: always()` is the warmth half of
      # BL-SCREENSHOTS-DRIFT-STALE-NEXTCACHE-SELF-PERPETUATING: the FIRST run at
      # any input set must save even when the byte gate fails, so a UI-change
      # commit whose drift run fails on stale baselines still leaves the next
      # same-input run warm. With the exact-input key this is warmth, not
      # convergence — a same-key restore is input-identical by construction, and
      # a later run at an already-saved key simply has its save skipped
      # (immutable entries). Ordered after the chown (it reads files the Docker
      # build left root-owned) and after the drift check.
      - name: Save Next build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .next-screenshots-help/cache
          key: ${{ steps.nextcache-restore.outputs.cache-primary-key }}
      # On drift, upload the freshly-captured bytes so the diff is inspectable
      # (PR #22 burned multiple round-trips diagnosing a one-file drift blind).
      - name: Upload drifted captures (diagnosis artifact)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: drifted-screenshots
          path: public/help/screenshots/
          retention-days: 7
